UPSTREAM_URL=https://github.com/PerformanC/ReZygisk.git
UPSTREAM_BRANCH=main
ZIP_PREFIX=ReZygisk
# nikakvo's v1.0.0-557-unofficial build
VERSION_CODE_FLOOR=557
# upstream .github/workflows/ci.yml: submodules, full history, make all with the newest NDK
# (versionCode = commit count; no signing key, like upstream's untrusted CI and nikakvo's
# 557: machikado/misaki ship empty, *.sha256 sidecars cover every file)
build() {
    git submodule update -q --init --recursive >&2
    NDK_PATH=/opt/android-sdk/ndk/30.0.16248370 make all -j"$(nproc)" >&2
    mv build/out/ReZygisk-v*-release.zip "$OUT/module.zip"
}
